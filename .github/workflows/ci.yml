name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run compile
      - run: npm run package:vsix
      - name: Prepare pinned Codespaces examples
        run: npm run demo:prepare
      - name: Verify all showcase maps through the agent loader
        run: npm run demo:verify
